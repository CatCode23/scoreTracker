name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public client configuration only. The anon key is designed to be public and all
      # data access is enforced by Supabase RLS. NEVER add SUPABASE_SERVICE_ROLE_KEY here.
      # Set these under Settings > Secrets and variables > Actions > Variables.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'WOTB Tournament Tracker' }}
      VITE_USERNAME_DOMAIN: ${{ vars.VITE_USERNAME_DOMAIN || 'wotb.local' }}
      # Must be "/<REPOSITORY_NAME>/". Defaults to this repository's name.
      VITE_GITHUB_PAGES_BASE: ${{ vars.VITE_GITHUB_PAGES_BASE || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Database migration + RLS tests (throwaway local Postgres)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql >/dev/null
          ./scripts/test-db.sh

      - name: Check Supabase configuration
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY repository variables are not set. The site will build but show 'not configured'."
          fi

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
